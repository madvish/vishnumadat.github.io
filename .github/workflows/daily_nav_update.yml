name: Daily NAV & Return Tracker

on:
  schedule:
    # Every 15 minutes during NSE market hours (Mon-Fri, 09:15-15:30 IST = 03:45-10:00 UTC)
    - cron: '*/15 3-10 * * 1-5'
    # Post-market settlement runs:
    # 12:30 UTC = 18:00 IST (after official NSE Bhavcopy and Yahoo Finance settle)
    - cron: '30 12 * * 1-5'
    # 13:45 UTC = 19:15 IST (backup run in case of scheduler delays or late vendor ingest)
    - cron: '45 13 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions UI

concurrency:
  group: daily-nav-update
  cancel-in-progress: false

jobs:
  update-nav:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily NAV Tracker
        run: |
          python scripts/daily_nav.py --unlisted-policy carry-inception

      - name: Commit and push updated NAV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices_daily.csv data/nav_daily.csv data/meta.json data/holdings.csv data/sectors.csv
          if git diff --staged --quiet; then
            echo "No changes detected. Data is already up to date."
          else
            git commit -m "Auto-update daily NAV, prices, and alpha ($(date +'%Y-%m-%d')) [skip ci]"
            git push
          fi
