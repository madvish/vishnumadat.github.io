name: Market Data Pipeline

on:
  schedule:
    # Run daily at 00:30 UTC (6:00 AM IST) on weekdays
    - cron: '30 0 * * 1-5'
    # Run again at 14:00 UTC (7:30 PM IST) to catch US market close data
    - cron: '0 14 * * 1-5'
    # Saturday run at 14:00 UTC to capture Friday's final data
    - cron: '0 14 * * 6'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

concurrency:
  group: market-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run market data pipeline
        run: |
          python pipeline/run.py
        env:
          TZ: Asia/Kolkata

      - name: Check for data changes
        id: check_changes
        run: |
          git add data/market/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data changes detected — will commit."
          fi

      - name: Commit and push updated data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update market dashboard data ($(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')) [skip ci]"
          git push
